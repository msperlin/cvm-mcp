[project]
name = "cvm-mcp"
version = "0.2.0"
description = "One MCP server for the whole CVM open-data repository (dados.cvm.gov.br)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marcelo S. Perlin" }]
keywords = ["mcp", "cvm", "b3", "brazil", "finance", "open-data", "funds", "dfp", "fre"]

dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "pandas>=2.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "filelock>=3.13",
    "pypdf>=4.0",
]

[project.scripts]
cvm-mcp = "cvm_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: hits dados.cvm.gov.br (deselect with '-m \"not network\"')",
]
